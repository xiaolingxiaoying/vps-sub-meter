[package]
name = "vps-sub-meter"
version = "2.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Dual-core (Xray + sing-box) PQC proxy & private subscription control plane"

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.48", features = ["derive"] }
fs2 = "0.4.3"
getrandom = "0.3.3"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.13", features = ["tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.16"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = "0.26.4"
toml = "0.8.20"
url = "2.5.7"
x25519-dalek = "2.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
