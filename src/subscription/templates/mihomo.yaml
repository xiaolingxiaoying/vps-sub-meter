# mihomo v1.19.31 通用完整配置模板（不是覆写文件）
# 用途：独立导入使用。订阅覆写请使用 mihomo-dns-sniffer.override.js。
# 使用前替换 proxies 内所有 YOUR-*、UUID、密码、公钥和 short-id 占位符。
# 无固定内网 DNS 或专属网段：私有域名使用当前系统 DNS，公网使用 DoH。
# 多个上游并发查询，不是按列表顺序逐个回退。
# 代理组选中 DIRECT 时，通过该组查询的境外 DoH 同样会直连。
# fake-ip-filter 只决定是否返回假 IP；分流规则决定直连或代理。
# 嗅探辅助规则匹配，不用嗅探结果覆盖应用选定的目标地址。
# 默认开启 TUN 与严格路由，需要管理员权限；若影响 WSL/VMware，
# 可将 tun.strict-route 设为 false，但会降低 Windows DNS 隔离能力。
# 应用自带 DoH 不受 53 端口劫持控制。
# Clash Party 的内核设置可能覆盖 DNS、嗅探、TUN 和基础开关，
# 导入后以最终 work/config.yaml 为准；未应用本文件到当前运行内核。

mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 0
tproxy-port: 0
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: always
external-controller: ''
secret: ''
profile:
  store-selected: true
  store-fake-ip: true
rule-providers:
  review-private-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs
    path: ./ruleset/review-private-domain.mrs
    interval: 86400
  review-cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
    path: ./ruleset/review-cn-domain.mrs
    interval: 86400
  review-private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs
    path: ./ruleset/review-private-ip.mrs
    interval: 86400
  review-cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs
    path: ./ruleset/review-cn-ip.mrs
    interval: 86400
proxies:
- name: node-01-vless-reality
  type: vless
  server: YOUR-SERVER.example.com
  port: 443
  uuid: 00000000-0000-0000-0000-000000000000
  network: tcp
  udp: true
  flow: xtls-rprx-vision
  tls: true
  servername: YOUR-CAMOUFLAGE.example.com
  client-fingerprint: chrome
  reality-opts:
    public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    short-id: 0123456789abcdef
- name: node-02-vmess-ws
  type: vmess
  server: YOUR-SERVER.example.com
  port: 443
  uuid: 00000000-0000-0000-0000-000000000000
  alterId: 0
  cipher: auto
  tls: true
  servername: YOUR-SNI.example.com
  network: ws
  ws-opts:
    path: /YOUR-WS-PATH
    headers:
      Host: YOUR-SNI.example.com
- name: node-03-hysteria2
  type: hysteria2
  server: YOUR-SERVER.example.com
  port: 443
  password: YOUR-PASSWORD
  sni: YOUR-SNI.example.com
  skip-cert-verify: false
  up: 50 Mbps
  down: 200 Mbps
- name: node-04-tuic
  type: tuic
  server: YOUR-SERVER.example.com
  port: 443
  uuid: 00000000-0000-0000-0000-000000000000
  password: YOUR-PASSWORD
  sni: YOUR-SNI.example.com
  alpn:
  - h3
  skip-cert-verify: false
proxy-groups:
- name: 代理
  type: select
  url: https://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - node-01-vless-reality
  - node-02-vmess-ws
  - node-03-hysteria2
  - node-04-tuic
  - 自动选择
  - DIRECT
- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - node-01-vless-reality
  - node-02-vmess-ws
  - node-03-hysteria2
  - node-04-tuic
rules:
- DOMAIN,services.googleapis.cn,代理
- DOMAIN-SUFFIX,msftconnecttest.com,DIRECT
- DOMAIN-SUFFIX,msftncsi.com,DIRECT
- DOMAIN-SUFFIX,captive.apple.com,DIRECT
- DOMAIN-SUFFIX,connectivitycheck.gstatic.com,DIRECT
- DOMAIN-SUFFIX,detectportal.firefox.com,DIRECT
- DOMAIN-SUFFIX,connectivity-check.ubuntu.com,DIRECT
- DOMAIN-SUFFIX,networkcheck.kde.org,DIRECT
- DOMAIN-SUFFIX,chatgpt.com,代理
- DOMAIN-SUFFIX,openai.com,代理
- DOMAIN-SUFFIX,oaistatic.com,代理
- DOMAIN-SUFFIX,oaiusercontent.com,代理
- DOMAIN-SUFFIX,x.com,代理
- DOMAIN-SUFFIX,twitter.com,代理
- DOMAIN-SUFFIX,twimg.com,代理
- DOMAIN-SUFFIX,lan,DIRECT
- DOMAIN-SUFFIX,local,DIRECT
- DOMAIN-SUFFIX,home.arpa,DIRECT
- RULE-SET,review-private-domain,DIRECT
- RULE-SET,review-cn-domain,DIRECT
- RULE-SET,review-private-ip,DIRECT,no-resolve
- RULE-SET,review-cn-ip,DIRECT
- MATCH,代理
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - rule-set:review-private-domain
  - +.lan
  - +.local
  - +.home.arpa
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.captive.apple.com
  - +.connectivitycheck.gstatic.com
  - +.detectportal.firefox.com
  - +.connectivity-check.ubuntu.com
  - +.networkcheck.kde.org
  - +.time.windows.com
  - +.time.apple.com
  - +.time.android.com
  - +.ntp.org
  - stun.*.*
  - +.stun.*.*
  use-hosts: false
  use-system-hosts: false
  respect-rules: false
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  nameserver-policy:
    +.lan,+.local,+.home.arpa,+.in-addr.arpa,+.ip6.arpa:
    - system
    rule-set:review-private-domain:
    - system
    ? +.msftconnecttest.com,+.msftncsi.com,+.captive.apple.com,+.connectivitycheck.gstatic.com,+.detectportal.firefox.com,+.connectivity-check.ubuntu.com,+.networkcheck.kde.org
    : - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    rule-set:review-cn-domain:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#代理
  - https://8.8.8.8/dns-query#代理
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080
      override-destination: false
    TLS:
      ports:
      - 443
      - 8443
      override-destination: false
    QUIC:
      ports:
      - 443
      - 8443
      override-destination: false
  skip-domain:
  - +.push.apple.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.captive.apple.com
  - +.connectivitycheck.gstatic.com
  - +.detectportal.firefox.com
  - +.connectivity-check.ubuntu.com
  - +.networkcheck.kde.org
  skip-dst-address:
  - 91.105.192.0/23
  - 91.108.4.0/22
  - 91.108.8.0/21
  - 91.108.16.0/21
  - 91.108.56.0/22
  - 95.161.64.0/20
  - 149.154.160.0/20
  - 185.76.151.0/24
tun:
  enable: true
  stack: mixed
  device: Mihomo
  mtu: 1400
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
  route-exclude-address: []
  route-exclude-address-set: []
  inet4-route-exclude-address: []
  inet6-route-exclude-address: []
geo-auto-update: false
geo-update-interval: 24
geodata-mode: false
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
