name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish immediately instead of draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_REPOSITORY: xiaolingxiaoying/vps-sub-meter
  DEV_PUBLIC_KEY_HEX: 247f88e163242986b7107eb704a983e12186d2697a3927b7e6b42ec2b364272b

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUBLIC_KEY_HEX: ${{ vars.VSM_RELEASE_PUBLIC_KEY_HEX || vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          tag=${INPUT_TAG:-${GITHUB_REF_NAME}}
          [[ "$tag" == v* ]] || { echo "tag must start with v" >&2; exit 1; }
          [ -n "${PUBLIC_KEY_HEX:-}" ] || { echo "missing release public key var" >&2; exit 1; }
          [ "$PUBLIC_KEY_HEX" != "$DEV_PUBLIC_KEY_HEX" ] || { echo "dev public key forbidden" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - env:
          VSM_RELEASE_PUBLIC_KEY_HEX: ${{ vars.VSM_RELEASE_PUBLIC_KEY_HEX || vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
        run: cargo build --release --locked --no-default-features
      - run: |
          mkdir -p dist
          install -m 0755 target/release/vps-sub-meter "dist/vps-sub-meter-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-vsm-${{ matrix.arch }}
          path: dist/vps-sub-meter-linux-${{ matrix.arch }}

  package:
    needs: [validate, ci, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-vsm-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          PUBLIC_KEY_HEX: ${{ vars.VSM_RELEASE_PUBLIC_KEY_HEX || vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
          SIGNING_SEED: ${{ secrets.VSM_SIGNING_SEED || secrets.SBCTL_SIGNING_SEED }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail
          chmod 0755 dist/vps-sub-meter-linux-amd64
          export VSM_SIGNER="$PWD/dist/vps-sub-meter-linux-amd64"
          umask 077
          seed_file=$(mktemp)
          trap 'rm -f "$seed_file"' EXIT
          printf '%s' "$SIGNING_SEED" > "$seed_file"
          export VSM_SIGNING_KEY="$seed_file"

          tar -czf dist/vps-sub-meter-bundle.tar.gz templates scripts
          for arch in amd64 arm64; do
            bash scripts/generate-manifest.sh \
              "$RELEASE_REPOSITORY" "$TAG" "$arch" \
              "dist/vps-sub-meter-linux-$arch" "dist/vps-sub-meter-bundle.tar.gz" "dist/manifest-$arch.json"
          done

          VSM_RELEASE_PUBLIC_KEY_HEX="$PUBLIC_KEY_HEX" python3 scripts/prepare-installer.py --template scripts/install.sh dist/install.sh
          VSM_RELEASE_PUBLIC_KEY_HEX="$PUBLIC_KEY_HEX" python3 scripts/prepare-installer.py --template scripts/upgrade.sh dist/upgrade.sh
          ( cd dist && sha256sum vps-sub-meter-linux-* vps-sub-meter-bundle.tar.gz manifest-*.json install.sh upgrade.sh > SHA256SUMS )

          gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes || true
          gh release upload "$TAG" dist/* --clobber
          if [ "$PUBLISH" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
