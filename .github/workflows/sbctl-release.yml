name: sbctl signed release

on:
  push:
    tags:
      - 'sbctl-v*'

permissions:
  contents: read

concurrency:
  group: sbctl-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SING_BOX_REPOSITORY: SagerNet/sing-box

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sing_box_tag: ${{ steps.sing_box.outputs.tag }}
      sing_box_version: ${{ steps.sing_box.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check release tag and production trust key
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("sbctl/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_TAG" != "sbctl-v$version" ]]; then
            echo "Release tag $RELEASE_TAG must match sbctl-v$version." >&2
            exit 1
          fi
          key=${SBCTL_RELEASE_PUBLIC_KEY_HEX:-}
          if [[ ! "$key" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Set the repository Actions variable SBCTL_RELEASE_PUBLIC_KEY_HEX to a 32-byte production public key." >&2
            exit 1
          fi
          if [[ "${key,,}" == "247f88e163242986b7107eb704a983e12186d2697a3927b7e6b42ec2b364272b" ]]; then
            echo "The public development signing key cannot be used for a production release." >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --manifest-path sbctl/Cargo.toml --all -- --check
      - name: Test installer scripts
        run: python3 -m unittest discover -s sbctl/scripts -p 'test_*.py'
      - name: Run clippy
        run: cargo clippy --manifest-path sbctl/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path sbctl/Cargo.toml --locked --workspace --features sbctl/test-signing
      - name: Verify production release trust boundary
        run: cargo test --manifest-path sbctl/Cargo.toml --locked -p sbctl --no-default-features --test release_trust
      - name: Read the pinned sing-box runtime
        id: sing_box
        run: |
          set -euo pipefail
          # The bundled runtime is pinned in one reviewed file, and
          # `generate-manifest.sh` reads the same file: a release cannot declare
          # a runtime it does not ship, and the archive is digest-verified
          # before the manifest that names it is signed.
          # shellcheck source=/dev/null
          . sbctl/scripts/release-runtime-pins.txt
          if [[ ! "$sing_box_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-runtime-pins.txt has a non-fixed sing_box_version: $sing_box_version" >&2
            exit 1
          fi
          echo "tag=v$sing_box_version" >> "$GITHUB_OUTPUT"
          echo "version=$sing_box_version" >> "$GITHUB_OUTPUT"
          echo "pinned sing-box runtime: $sing_box_version"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build production sbctl
        working-directory: sbctl
        env:
          SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
        run: cargo build --release --locked -p sbctl --no-default-features
      - name: Refuse to publish a binary that trusts the development key
        working-directory: sbctl
        run: bash scripts/dev/release-trust-anchor-check.sh target/release/sbctl
      - name: Stage architecture-specific binary
        working-directory: sbctl
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          install -m 0755 target/release/sbctl "$GITHUB_WORKSPACE/dist/sbctl-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbctl-linux-${{ matrix.arch }}
          path: dist/sbctl-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  runtime:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the pinned sing-box runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . sbctl/scripts/release-runtime-pins.txt
          case "$ARCH" in
            amd64) expected=$sha256_amd64 ;;
            arm64) expected=$sha256_arm64 ;;
            *) echo "unsupported architecture $ARCH" >&2; exit 1 ;;
          esac
          archive="sing-box-${sing_box_version}-linux-${ARCH}.tar.gz"
          url="https://github.com/${SING_BOX_REPOSITORY}/releases/download/v${sing_box_version}/${archive}"
          curl -fsSL --retry 3 --proto '=https' -o "$RUNNER_TEMP/$archive" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check --status
          # Cross-check the pin against the GitHub API's own digest so a stale
          # pin cannot silently ship a different runtime.
          api_digest=$(curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' -H 'User-Agent: sbctl' \
            "https://api.github.com/repos/${SING_BOX_REPOSITORY}/releases/tags/v${sing_box_version}" \
            | jq -r --arg name "$archive" '.assets[] | select(.name == $name) | .digest // empty' \
            | sed -n 's/^sha256://p')
          if [ -z "$api_digest" ]; then
            echo "GitHub published no digest for $archive; refusing to sign an unverifiable runtime" >&2
            exit 1
          fi
          if [ "$api_digest" != "$expected" ]; then
            echo "pinned digest for $archive is stale: pinned $expected, GitHub reports $api_digest" >&2
            exit 1
          fi
          mkdir -p dist
          # Extract exactly the kernel member: `tar -xzf` of the whole archive
          # as root is a traversal surface, and the other members are not part
          # of the release.
          member="sing-box-${sing_box_version}-linux-${ARCH}/sing-box"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --no-same-owner --no-same-permissions -- "$member"
          install -m 0755 "$RUNNER_TEMP/$member" "dist/sing-box-linux-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-${{ matrix.arch }}
          path: dist/sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  package:
    needs: [validate, build, runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
      SING_BOX_TAG: ${{ needs.validate.outputs.sing_box_tag }}
      SING_BOX_VERSION: ${{ needs.validate.outputs.sing_box_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbctl-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-linux-${{ matrix.arch }}
          path: dist
      - name: Write signing seed to a private temporary file
        env:
          SBCTL_SIGNING_SEED: ${{ secrets.SBCTL_SIGNING_SEED }}
        run: |
          set -euo pipefail
          : "${SBCTL_SIGNING_SEED:?Configure SBCTL_SIGNING_SEED in the release Environment.}"
          umask 077
          key_file="$RUNNER_TEMP/sbctl-signing-seed.hex"
          printf '%s\n' "$SBCTL_SIGNING_SEED" > "$key_file"
          chmod 600 "$key_file"
          echo "SBCTL_SIGNING_KEY=$key_file" >> "$GITHUB_ENV"
          unset SBCTL_SIGNING_SEED
      - name: Sign and verify native architecture manifest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod 0755 "dist/sbctl-linux-$ARCH"
          export SBCTL_SIGNER="$GITHUB_WORKSPACE/dist/sbctl-linux-$ARCH"
          bash sbctl/scripts/generate-manifest.sh \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$SING_BOX_VERSION" "$ARCH" \
            "dist/sbctl-linux-$ARCH" "dist/sing-box-linux-$ARCH" "dist/manifest-$ARCH.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sbctl-release-${{ matrix.arch }}
          path: |
            dist/sbctl-linux-${{ matrix.arch }}
            dist/sing-box-linux-${{ matrix.arch }}
            dist/manifest-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sbctl-release-*
          path: dist
          merge-multiple: true
      - name: Prepare production installer and checksums
        run: |
          set -euo pipefail
          python3 sbctl/scripts/prepare-installer.py dist/install.sh
          chmod 0755 dist/install.sh
          (cd dist && sha256sum \
            sbctl-linux-amd64 sbctl-linux-arm64 \
            sing-box-linux-amd64 sing-box-linux-arm64 \
            manifest-amd64.json manifest-arm64.json install.sh > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#sbctl-v}
          assets=(
            dist/sbctl-linux-amd64 dist/sbctl-linux-arm64
            dist/sing-box-linux-amd64 dist/sing-box-linux-arm64
            dist/manifest-amd64.json dist/manifest-arm64.json
            dist/install.sh dist/SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "sbctl v$version" \
              --notes "Prebuilt sbctl and sing-box for Linux amd64/arm64. The signed manifests pin the binary digests; install.sh verifies the signature before installation." \
              --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sbctl v$version" \
              --notes "Prebuilt sbctl and sing-box for Linux amd64/arm64. The signed manifests pin the binary digests; install.sh verifies the signature before installation." \
              --latest
          fi

  verify-release:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download assets from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: Verify downloaded release assets
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          chmod 0755 dist/sbctl-linux-amd64
          dist/sbctl-linux-amd64 release verify --manifest dist/manifest-amd64.json
          dist/sbctl-linux-amd64 release verify --manifest dist/manifest-arm64.json
          bash sbctl/scripts/dev/release-trust-anchor-check.sh dist/sbctl-linux-amd64
          bash -n dist/install.sh
          if grep -q '@SBCTL_RELEASE_PUBLIC_KEY_PEM@' dist/install.sh; then
            echo "Published installer still contains the public-key placeholder." >&2
            exit 1
          fi
