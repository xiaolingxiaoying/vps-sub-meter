name: sbctl signed release

on:
  push:
    tags:
      - 'sbctl-v*'

permissions:
  contents: read

concurrency:
  group: sbctl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check release tag and production trust key
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("sbctl/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_TAG" != "sbctl-v$version" ]]; then
            echo "Release tag $RELEASE_TAG must match sbctl-v$version." >&2
            exit 1
          fi
          key=${SBCTL_RELEASE_PUBLIC_KEY_HEX:-}
          if [[ ! "$key" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Set the repository Actions variable SBCTL_RELEASE_PUBLIC_KEY_HEX to a 32-byte production public key." >&2
            exit 1
          fi
          if [[ "${key,,}" == "247f88e163242986b7107eb704a983e12186d2697a3927b7e6b42ec2b364272b" ]]; then
            echo "The public development signing key cannot be used for a production release." >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --manifest-path sbctl/Cargo.toml --all -- --check
      - name: Test installer scripts
        run: python3 -m unittest discover -s sbctl/scripts -p 'test_*.py'
      - name: Run clippy
        run: cargo clippy --manifest-path sbctl/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path sbctl/Cargo.toml --locked --workspace --features sbctl/test-signing
      - name: Verify production release trust boundary
        run: cargo test --manifest-path sbctl/Cargo.toml --locked -p sbctl --no-default-features --test release_trust

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build production sbctl
        working-directory: sbctl
        env:
          SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
        run: cargo build --release --locked -p sbctl --no-default-features
      - name: Stage architecture-specific binary
        working-directory: sbctl
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          install -m 0755 target/release/sbctl "$GITHUB_WORKSPACE/dist/sbctl-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbctl-linux-${{ matrix.arch }}
          path: dist/sbctl-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SBCTL_RELEASE_PUBLIC_KEY_HEX: ${{ vars.SBCTL_RELEASE_PUBLIC_KEY_HEX }}
      SING_BOX_REPOSITORY: SagerNet/sing-box
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sbctl-linux-*
          path: dist
          merge-multiple: true
      - name: Resolve latest stable sing-box release
        id: sing-box
        run: |
          set -euo pipefail
          release_url=$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' \
            "https://github.com/${SING_BOX_REPOSITORY}/releases/latest")
          case "$release_url" in
            https://github.com/SagerNet/sing-box/releases/tag/v*) tag=${release_url##*/} ;;
            *) echo "Could not resolve a stable sing-box release URL: $release_url" >&2; exit 1 ;;
          esac
          version=${tag#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected sing-box version: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download official sing-box runtime archives
        env:
          SING_BOX_TAG: ${{ steps.sing-box.outputs.tag }}
          SING_BOX_VERSION: ${{ steps.sing-box.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="sing-box-${SING_BOX_VERSION}-linux-${arch}.tar.gz"
            url="https://github.com/${SING_BOX_REPOSITORY}/releases/download/${SING_BOX_TAG}/${archive}"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$url"
            mkdir -p "$RUNNER_TEMP/sing-box-$arch"
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/sing-box-$arch" --strip-components=1
            install -m 0755 "$RUNNER_TEMP/sing-box-$arch/sing-box" "dist/sing-box-linux-$arch"
          done
      - name: Write signing seed to a private temporary file
        env:
          SBCTL_SIGNING_SEED: ${{ secrets.SBCTL_SIGNING_SEED }}
        run: |
          set -euo pipefail
          : "${SBCTL_SIGNING_SEED:?Configure SBCTL_SIGNING_SEED in the release Environment.}"
          umask 077
          key_file="$RUNNER_TEMP/sbctl-signing-seed.hex"
          printf '%s\n' "$SBCTL_SIGNING_SEED" > "$key_file"
          chmod 600 "$key_file"
          echo "SBCTL_SIGNING_KEY=$key_file" >> "$GITHUB_ENV"
          unset SBCTL_SIGNING_SEED
      - name: Sign and verify architecture manifests
        env:
          SING_BOX_VERSION: ${{ steps.sing-box.outputs.version }}
        run: |
          set -euo pipefail
          chmod 0755 dist/sbctl-linux-amd64 dist/sbctl-linux-arm64
          for arch in amd64 arm64; do
            export SBCTL_SIGNER="$GITHUB_WORKSPACE/dist/sbctl-linux-$arch"
            bash sbctl/scripts/generate-manifest.sh \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$SING_BOX_VERSION" "$arch" \
              "dist/sbctl-linux-$arch" "dist/sing-box-linux-$arch" "dist/manifest-$arch.json"
          done
      - name: Prepare production installer and checksums
        run: |
          set -euo pipefail
          python3 sbctl/scripts/prepare-installer.py dist/install.sh
          chmod 0755 dist/install.sh
          (cd dist && sha256sum \
            sbctl-linux-amd64 sbctl-linux-arm64 \
            sing-box-linux-amd64 sing-box-linux-arm64 \
            manifest-amd64.json manifest-arm64.json install.sh > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#sbctl-v}
          gh release create "$RELEASE_TAG" \
            dist/sbctl-linux-amd64 dist/sbctl-linux-arm64 \
            dist/sing-box-linux-amd64 dist/sing-box-linux-arm64 \
            dist/manifest-amd64.json dist/manifest-arm64.json \
            dist/install.sh dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "sbctl v$version" \
            --notes "Prebuilt sbctl and sing-box for Linux amd64/arm64. The signed manifests pin the binary digests; install.sh verifies the signature before installation." \
            --latest
