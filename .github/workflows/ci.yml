name: CI

# Server-side CI: the sbctl binary, its subscription renderer, and the real
# cores that validate every generated version profile. The client crates
# (sbtui, sbcli, sbgui, client-core) are not in this workspace, so the monorepo's
# GUI, prototype, MSI and macOS jobs live where those crates live.

on:
  push:
    branches: [dev]
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-sbctl-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # Compile check only: this job deliberately does not inject
      # SBCTL_RELEASE_PUBLIC_KEY_HEX, so the produced binary fails closed on
      # `sbctl update` and must never be published. The signed release build
      # lives in release.yml.
      - name: Build sbctl production binary
        run: cargo build --release --locked -p sbctl --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: sbctl-linux-amd64
          path: target/release/sbctl
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check installation and recovery shell entry points
        run: |
          for script in scripts/*.sh scripts/dev/*.sh tests/acceptance/*.sh; do
            bash -n "$script"
          done
      - name: Verify subscription page copy interactions
        run: node tests/index-copy.mjs
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --features sbctl/test-signing
      - name: Exercise menu and first-install prompts in isolated terminals
        run: |
          python3 tests/acceptance/verify-menu.py target/debug/sbctl
          python3 tests/acceptance/verify-managed-menu.py target/debug/sbctl
          python3 tests/acceptance/verify-onboarding.py --cli target/debug/sbctl
          python3 tests/acceptance/verify-review.py target/debug/sbctl
      - name: Verify private mail and daemon storage with real Linux UIDs
        run: |
          sudo bash scripts/dev/check-storage-permissions.sh "$GITHUB_WORKSPACE/target/debug/sbctl"
          sudo python3 scripts/dev/check-api-certificate-permissions.py "$GITHUB_WORKSPACE/target/debug/sbctl"
          sudo python3 scripts/dev/check-managed-fs-boundaries.py "$GITHUB_WORKSPACE/target/debug/sbctl"
          sudo unshare --net python3 scripts/dev/check-certificate-generation.py "$GITHUB_WORKSPACE/target/debug/sbctl" --serve
      - run: cargo test --locked -p sbctl --no-default-features --test release_trust

  # The systemd acceptance suite (`sh tests/acceptance/run.sh`) drives real
  # systemd inside disposable containers on three distributions. It is the only
  # gate that can catch install-transaction, rollback and unit-permission
  # regressions, so it runs on every change. The suite's two client legs need
  # the terminal client and `sbcli`, which this workspace does not contain; the
  # script detects that and skips exactly those two assertions.
  server-acceptance:
    needs: [test, build-sbctl-linux-amd64]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@v4
        with:
          name: sbctl-linux-amd64
          path: .scratch/acceptance-bin
      - name: Prepare the production binary and build its test-signing counterpart
        run: |
          set -euo pipefail
          cd .scratch/acceptance-bin
          mv sbctl sbctl-linux-amd64
          chmod 0755 sbctl-linux-amd64
          cd ../..
          cargo build --release --locked -p sbctl --features test-signing
          install -m 0755 target/release/sbctl .scratch/acceptance-bin/sbctl-test-signing
      - name: Run the server-only systemd acceptance suite
        env:
          SBCTL_ARTIFACT: ${{ github.workspace }}/.scratch/acceptance-bin/sbctl-linux-amd64
          SBCTL_TEST_ARTIFACT: ${{ github.workspace }}/.scratch/acceptance-bin/sbctl-test-signing
        run: sh tests/acceptance/run.sh

  sing-box-profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Download pinned sing-box cores
        run: bash scripts/dev/ci-cores.sh sing-box
      - name: Record the latest stable sing-box release
        id: upstream
        run: |
          set -euo pipefail
          # `releases/latest` already excludes drafts and prereleases, so this
          # is the version `sbctl install` will actually download.
          release_url=$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' \
            https://github.com/SagerNet/sing-box/releases/latest)
          case "$release_url" in
            https://github.com/SagerNet/sing-box/releases/tag/*) tag=${release_url##*/} ;;
            *)
              echo "could not resolve the latest sing-box release URL; refusing to skip the band check" >&2
              exit 1
              ;;
          esac
          [ -n "$tag" ] || {
            echo "could not read the latest sing-box tag; refusing to skip the band check" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest stable sing-box: $tag"
      - name: Validate every generated profile with its real core
        env:
          SING_BOX_BIN_1_10: ${{ github.workspace }}/sing-box-1.10.7/sing-box
          SING_BOX_BIN_1_11: ${{ github.workspace }}/sing-box-1.11.15/sing-box
          SING_BOX_BIN_1_12: ${{ github.workspace }}/sing-box-1.12.25/sing-box
          SING_BOX_BIN_1_13: ${{ github.workspace }}/sing-box-1.13.21/sing-box
          SING_BOX_BIN_1_14: ${{ github.workspace }}/sing-box-1.14.1/sing-box
          SING_BOX_BIN_1_14_4: ${{ github.workspace }}/sing-box-1.14.4/sing-box
          SBCTL_UPSTREAM_LATEST: ${{ steps.upstream.outputs.tag }}
        run: cargo test --locked --test version_profiles -- --ignored --nocapture
      - name: Verify certificate generation refresh with a real sing-box core
        run: |
          cargo build --locked -p sbctl
          sudo unshare --net python3 scripts/dev/check-certificate-generation.py "$GITHUB_WORKSPACE/target/debug/sbctl" --serve --core "$GITHUB_WORKSPACE/sing-box-1.14.1/sing-box"
      - name: Install nftables for the isolated Hy2 hopping check
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Verify five protocol data planes in a private network namespace
        run: |
          sudo unshare --net -- sh -ec 'ip link set lo up; exec python3 tests/acceptance/verify-proxy-data.py target/debug/sbctl --sing-box sing-box-1.14.1/sing-box --port-hopping'

      - name: Fetch fixed Xray and Mihomo interoperability baselines
        run: bash scripts/dev/ci-cores.sh managed
      - name: Validate unified generations and real protocol forwarding
        env:
          SBCTL_XRAY_BIN: ${{ github.workspace }}/managed-cores/xray
          MIHOMO_BIN: ${{ github.workspace }}/managed-cores/mihomo
          SING_BOX_BIN_1_10: ${{ github.workspace }}/sing-box-1.10.7/sing-box
          SING_BOX_BIN_1_11: ${{ github.workspace }}/sing-box-1.11.15/sing-box
          SING_BOX_BIN_1_12: ${{ github.workspace }}/sing-box-1.12.25/sing-box
          SING_BOX_BIN_1_13: ${{ github.workspace }}/sing-box-1.13.21/sing-box
          SING_BOX_BIN_1_14: ${{ github.workspace }}/sing-box-1.14.1/sing-box
        run: |
          cargo test --locked --test setup_ports -- --ignored --nocapture
          cargo test --locked --lib shared_tls_carries_a_real_node_request -- --ignored --nocapture
          cargo test --locked --test managed_deployment -- --ignored --nocapture
          cargo test --locked --test xray_core -- --ignored --nocapture
          cargo test --locked --test probe -- --ignored --nocapture
          cargo test --locked --test preset_connections tls_presets_carry_http -- --ignored --nocapture
          SBCTL_CLIENT_BIN="$SING_BOX_BIN_1_14" cargo test --locked --test preset_connections sing_box_compatible -- --ignored --nocapture
          SBCTL_CLIENT_BIN="$MIHOMO_BIN" cargo test --locked --test preset_connections mihomo_compatible -- --ignored --nocapture

  mihomo-profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Download a pinned mihomo core
        run: bash scripts/dev/ci-cores.sh mihomo
      - name: Load every generated clash artifact in mihomo
        env:
          MIHOMO_BIN: ${{ github.workspace }}/mihomo/mihomo
          MIHOMO_LEGACY_BIN: ${{ github.workspace }}/mihomo/mihomo-legacy
        run: cargo test --locked --test clash_mihomo -- --ignored --nocapture
