<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #e2e8f0; }
  .wrap { max-width: 1020px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; overflow-wrap: anywhere; }
  .sub { color: #94a3b8; font-size: 0.9rem; margin: 0 0 10px; line-height: 1.45; overflow-wrap: anywhere; }
  .nodes-details, .uri-details { margin-bottom: 14px; }
  .nodes-details summary, .uri-details summary { cursor: pointer; color: #38bdf8; font-size: 0.86rem; user-select: none; }
  .node-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 180px; overflow-y: auto; padding: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; }
  .node-chip { font-size: 0.78rem; color: #cbd5e1; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 3px 8px; }
  .stats { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-items: center; }
  .stat-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
  .stat-value { font-size: 1.3rem; font-weight: 700; color: #f8fafc; }
  .stat-value span { font-size: 0.95rem; font-weight: 500; color: #94a3b8; }
  .stat-meta { font-size: 0.82rem; color: #94a3b8; margin-top: 6px; line-height: 1.4; }
  .bar { height: 8px; background: #0f172a; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #3b82f6); width: {{PCT}}%; }
  .bar-fill.over { background: linear-gradient(90deg, #f97316, #ef4444); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card h2 { font-size: 1.02rem; margin: 0; color: #f8fafc; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .desc { font-size: 0.84rem; color: #94a3b8; margin: 0; line-height: 1.4; }
  .qr { background: #fff; border-radius: 8px; padding: 10px; align-self: center; }
  .qr svg { display: block; width: 180px; max-width: 100%; height: auto; }
  .url-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; overflow-x: auto; }
  .uri-box { max-height: 260px; overflow-y: auto; margin-top: 8px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; word-break: break-all; color: #38bdf8; }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  button, .btn-link { flex: 1 1 110px; text-align: center; text-decoration: none; cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-size: 0.88rem; font-weight: 500; line-height: 1.3; }
  button:hover, .btn-link:hover { background: #1d4ed8; }
  .btn-secondary { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; }
  .btn-secondary:hover { background: #334155; color: #fff; }
  .card-head button { flex: 0 0 auto; }
  @media (max-width: 600px) {
    body { padding: 14px; }
    .stats, .card { padding: 14px; }
    .grid { grid-template-columns: 1fr; }
    .card-head button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{TITLE}}</h1>
  {{NODES_SECTION}}
  <div class="stats">
    <div>
      <div class="stat-label">本期流量</div>
      <div class="stat-value">{{USED}} <span>/ {{TOTAL}}</span></div>
      <div class="bar"{{BAR_ATTR}}><div class="{{BAR_CLASS}}"></div></div>
      <div class="stat-meta">{{QUOTA_META}}</div>
    </div>
    <div>
      <div class="stat-label">下次重置</div>
      <div class="stat-value">{{RESET}}</div>
      <div class="stat-meta">共 {{NODE_COUNT}} 个节点</div>
    </div>
  </div>
  <div class="grid">{{CARDS}}</div>
  <div class="card" style="margin-top:16px">
    <div class="card-head">
      <h2>节点分享链接原文</h2>
      <button type="button" onclick="copyText(this)" data-val="{{URI_ESCAPED}}">复制全部节点链接</button>
    </div>
    <details class="uri-details"{{URI_OPEN_ATTR}}>
      <summary>查看全部 {{NODE_COUNT}} 条节点链接</summary>
      <div class="url-box uri-box"><code style="white-space:pre-wrap">{{URI_ESCAPED}}</code></div>
    </details>
  </div>
</div>
<script>
function flashButton(btn, label) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = label;
  clearTimeout(btn._timer);
  btn._timer = setTimeout(() => { btn.textContent = old; }, 1500);
}
function fallbackCopy(val) {
  const area = document.createElement("textarea");
  area.value = val;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  document.body.removeChild(area);
  return ok;
}
function copyText(btn) {
  const val = btn.getAttribute("data-val") || "";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(
      () => flashButton(btn, "已复制"),
      () => flashButton(btn, fallbackCopy(val) ? "已复制" : "请手动复制")
    );
  } else {
    flashButton(btn, fallbackCopy(val) ? "已复制" : "请手动复制");
  }
}
</script>
</body>
</html>
